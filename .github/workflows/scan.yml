name: Scan Ballerina

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Scans the order service and shows the findings as workflow annotations, without uploading them.
# The gate allows 5 high findings. main has 8, so the job fails on main and on every pull request,
# because the gate counts every finding in the package, not only new ones. Code scanning also
# compares a pull request's findings with main, and the "Block new code scanning alerts" ruleset
# blocks the merge when there are new alerts or no results.
jobs:
  scan:
    name: Scan order service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan order service
        uses: CharanaManawathilake/scan-ballerina@allow-pr-code-scanning-upload
        with:
          ballerina-version: 2201.13.5
          paths: order-service
          category: order-service
          exclude-tests: true
          fail-on-severity: high
          max-findings: 5
          annotations: true
          job-summary: true
          artifacts: true
