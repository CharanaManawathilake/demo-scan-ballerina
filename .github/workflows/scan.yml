name: Scan Ballerina

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Scans the order service and uploads the findings to GitHub code scanning. There is no gate, so
# the job passes whatever the findings are. On a pull request, code scanning compares the findings
# with main and reports only the new ones.
jobs:
  scan:
    name: Scan order service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan order service
        uses: ballerina-platform/scan-ballerina@v0.1.0
        with:
          ballerina-version: 2201.13.5
          paths: order-service
          category: order-service
          exclude-tests: true
          annotations: false
          job-summary: true
          artifacts: true
          platforms: github-code-scanning
