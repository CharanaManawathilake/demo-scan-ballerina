name: Scan Ballerina

on:
  push:
    branches:
      - main
      - demo-base # A fixed base for the demo pull requests, as main keeps changing
  pull_request:
    branches:
      - main
      - demo-base
  workflow_dispatch:

permissions:
  contents: read

# Scans the order service and uploads the findings to GitHub code scanning.
# The gate allows 5 high findings. main has 8, so the job fails on main and on every pull request,
# because the gate counts every finding in the package, not only new ones. Code scanning also
# compares a pull request's findings with main, and the "Block new code scanning alerts" ruleset
# blocks the merge when there are new alerts or no results.
jobs:
  scan:
    name: Scan order service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write # Comments the suppressed findings at their lines
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@585120e3f0e540bf127376ee6e75d39e8ce6aaa4 # v1.1.5
        with:
          version: 2201.13.5

      - name: Build order service
        working-directory: orders
        run: bal build

      - name: Scan order service
        uses: CharanaManawathilake/scan-ballerina@be2d04845c592084f9e50d941e2c4bc5bf20a990 # support-in-source-suppressions
        env:
          BALLERINA_STAGE_CENTRAL: 'true' # bal scan 0.11.1 is only on staging Central
        with:
          ballerina-version: 2201.13.5
          tool-version: 0.11.1
          paths: orders
          category: orders
          exclude-tests: true
          fail-on-severity: high
          fail-on-count: 6
          annotations: false
          job-summary: true
          artifacts: true
          platforms: github-code-scanning
          pr-comment: true
