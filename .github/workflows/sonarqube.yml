name: SonarQube

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Sends the findings of the order service to one SonarQube project, from one job and one scan.
# Needs the SONAR_HOST_URL variable and the SONAR_TOKEN secret, and the Ballerina plugin on the server.
jobs:
  sonarqube:
    name: Send findings to SonarQube
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # The platform plugin is downloaded from GitHub Packages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube needs history for blame and new-code detection

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@585120e3f0e540bf127376ee6e75d39e8ce6aaa4 # v1.1.5
        with:
          version: 2201.13.5

      - name: Build order service
        working-directory: orders
        run: bal build

      - name: Scan and send to SonarQube
        uses: CharanaManawathilake/scan-ballerina@allow-pr-code-scanning-upload
        with:
          ballerina-version: 2201.13.5
          paths: orders
          category: sonarqube
          exclude-tests: true
          job-summary: true
          platforms: sonarqube
          platform-config: |
            sonarqube:
              host-url: '${{ vars.SONAR_HOST_URL }}'
              token: '${{ secrets.SONAR_TOKEN }}'
              packages:
                - path: orders
                  project-key: demo-scan-ballerina-order-service
                  project-name: demo-scan-ballerina order service
